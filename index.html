<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#ef1b2d" />
    <meta name="description" content="Hệ thống báo cáo sản xuất di động - HCM Plant" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Viet Nhat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Hệ Thống Báo Cáo Sản Xuất Di Động | HCM Plant</title>
    <script>
      (function () {
        if (location.hostname === 'localhost' && location.port === '3001') {
          location.replace('http://127.0.0.1:' + location.port + location.pathname + location.search + location.hash);
          return;
        }

        var key = 'vnipt-cache-v';
        var version = '2026-07-16c';
        if (localStorage.getItem(key) === version) return;
        localStorage.setItem(key, version);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (name) { caches.delete(name); });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
